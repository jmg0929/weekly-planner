<meta charset="utf-8">
<title>주간 플래너</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="플래너">
<meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E14" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">

<style>
:root{
  --bg:#FBFBFD;
  --surface:#FFFFFF;
  --surface-2:#F4F4F8;
  --ink:#1B1B2A;
  --ink-2:#5A5A72;
  --muted:#9A9AB0;
  --line:#EAEAF1;
  --line-strong:#DEDEE8;
  --accent:#5B5BD6;
  --accent-soft:#ECECFB;
  --now:#F43F5E;
  --holiday-bg:#FDF4F6;
  --shadow:0 8px 30px rgba(24,24,48,.12);
  --shadow-sm:0 1px 2px rgba(24,24,48,.06);
  --gutterW:42px;
  --hourH:54px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0E0E14;
    --surface:#17171F;
    --surface-2:#1F1F2A;
    --ink:#ECECF4;
    --ink-2:#A8A8BC;
    --muted:#6E6E84;
    --line:#26262F;
    --line-strong:#33333F;
    --accent:#8A8AF0;
    --accent-soft:#22223A;
    --now:#FB6F86;
    --holiday-bg:color-mix(in srgb, #FDF4F6 11%, var(--surface));
    --shadow:0 10px 34px rgba(0,0,0,.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E14;
  --surface:#17171F;
  --surface-2:#1F1F2A;
  --ink:#ECECF4;
  --ink-2:#A8A8BC;
  --muted:#6E6E84;
  --line:#26262F;
  --line-strong:#33333F;
  --accent:#8A8AF0;
  --accent-soft:#22223A;
  --now:#FB6F86;
  --holiday-bg:color-mix(in srgb, #FDF4F6 11%, var(--surface));
  --shadow:0 10px 34px rgba(0,0,0,.5);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

.planner{display:flex;flex-direction:column;height:100dvh;max-width:900px;margin:0 auto;position:relative}

/* ---------- Top bar ---------- */
.topbar{
  flex:none;padding:calc(var(--sat) + 12px) 16px 10px;
  background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
  position:relative;z-index:20;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* 카테고리 필터 바 */
.filterbar{flex:none;display:flex;gap:7px;align-items:center;padding:8px 12px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.filterbar::-webkit-scrollbar{display:none}
.fchip{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-weight:700;font-size:12.5px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);white-space:nowrap;flex:none;transition:.12s}
.fchip:active{transform:scale(.95)}
.fchip .cdot{width:9px;height:9px;border-radius:50%;flex:none}
.fchip.off{opacity:.38}
.fchip.manage{color:var(--ink-2);padding:5px 10px}
.fchip.manage svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fchip.modetoggle svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fchip.modetoggle.on{background:var(--accent);color:#fff;border-color:transparent}
.fdiv{width:1px;height:18px;background:var(--line-strong);flex:none;margin:0 3px}
.left-group{display:flex;align-items:center;gap:9px;min-width:0}
.backbtn{
  display:flex;align-items:center;gap:1px;height:36px;padding:0 12px 0 7px;border-radius:12px;
  font-weight:800;font-size:14px;background:var(--accent-soft);color:var(--accent);flex:none;
  transition:transform .12s;
}
.backbtn:active{transform:scale(.94)}
.backbtn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.title{display:flex;flex-direction:column;gap:1px;min-width:0}
.title .month{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.title .range{font-size:12.5px;color:var(--ink-2);font-weight:500}
.ctrls{display:flex;align-items:center;gap:6px}
.iconbtn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface);box-shadow:var(--shadow-sm);color:var(--ink);
  border:1px solid var(--line);transition:transform .12s ease, background .15s;
}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.today-btn{
  height:38px;padding:0 14px;border-radius:12px;font-weight:700;font-size:13.5px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
}
.today-btn:active{transform:scale(.95)}
.add-btn{background:var(--accent);color:#fff;border-color:transparent}
.add-btn svg{stroke:#fff}

/* ---------- Day header ---------- */
.dayhead{
  flex:none;display:grid;grid-template-columns:var(--gutterW) 1fr;
  background:var(--surface);border-bottom:1px solid var(--line-strong);
  position:relative;z-index:15;box-shadow:0 1px 0 var(--line);
}
.dayhead .corner{border-right:1px solid var(--line);position:relative}
.cornerbtn{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--accent)}
.cornerbtn:active{background:var(--accent-soft)}
.cornerbtn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cornerbtn span{font-size:8px;font-weight:800;color:var(--accent);letter-spacing:.02em;line-height:1}
.dayhead .hdays{display:grid;grid-template-columns:repeat(7,1fr)}
.dh{
  padding:7px 2px 8px;text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:3px;border-left:1px solid var(--line);cursor:pointer;
}
.dh:first-child{border-left:none}
.dh .dow{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.dh .dnum{
  font-size:15px;font-weight:700;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;line-height:1;
}
.dh.sat .dow{color:#4F86D6}
.dh.sun .dow{color:#E5687F}
.dh.holiday .dnum{color:var(--now)}
.dh .hname{font-size:8.5px;font-weight:700;color:var(--now);line-height:1.1;margin-top:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1px}
.dh.today .dnum{background:var(--accent);color:#fff}
.dh.today .dow{color:var(--accent)}
.dh.sel .dnum{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- Scroll grid ---------- */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.scroll::-webkit-scrollbar{display:none}
.scroll{scrollbar-width:none}
.board{display:grid;grid-template-columns:var(--gutterW) 1fr;position:relative}

.gutter{position:relative}
.gutter .hr{
  height:var(--hourH);position:relative;
}
.gutter .hr span{
  position:absolute;top:-7px;right:6px;font-family:'DM Mono',ui-monospace,monospace;
  font-size:11px;color:var(--ink-2);font-weight:600;letter-spacing:-.02em;
}
.gutter .hr:first-child span{top:2px}

.days{
  position:relative;display:grid;grid-template-columns:repeat(7,1fr);
}
.daycol{position:relative;border-left:1px solid var(--line)}
.daycol:first-child{border-left:none}
.daycol.wknd{background:var(--holiday-bg)}
.daycol.holiday{background:var(--holiday-bg)}
.daycol.today{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}

/* 시간 구분선 오버레이 — 쉬는 날 색 위에도 보이도록 위(z-index:1)에 그림 */
.days::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:
    repeating-linear-gradient(to bottom, transparent, transparent calc(var(--hourH) - 1px), var(--line-strong) calc(var(--hourH) - 1px), var(--line-strong) var(--hourH)),
    repeating-linear-gradient(to bottom, transparent, transparent calc(var(--hourH)/2 - .5px), color-mix(in srgb,var(--line-strong) 55%,transparent) calc(var(--hourH)/2 - .5px), color-mix(in srgb,var(--line-strong) 55%,transparent) calc(var(--hourH)/2), transparent calc(var(--hourH)/2), transparent var(--hourH));
}

/* ---------- Events ---------- */
.evt{
  position:absolute;left:2px;right:2px;border-radius:9px;overflow:hidden;
  padding:5px 7px 5px 9px;cursor:pointer;z-index:4;
  background:color-mix(in srgb,var(--evt) 30%,var(--surface));
  border:1px solid color-mix(in srgb,var(--evt) 45%,var(--surface));
  border-left:3px solid var(--evt);
  transition:transform .1s ease, box-shadow .12s;
  min-height:18px;display:flex;flex-direction:column;gap:2px;
}
.evt:active{transform:scale(.97);box-shadow:var(--shadow)}
.evt .et{
  font-size:10.5px;font-weight:700;line-height:1.25;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:keep-all;overflow-wrap:anywhere;
}
.evt .eloc,.evt .etime{
  font-size:9px;color:var(--ink-2);font-weight:600;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.evt.lecture::after{
  content:"";position:absolute;top:3px;right:3px;width:4px;height:4px;border-radius:50%;
  background:var(--evt);opacity:.95;
}
.evt.short{padding:2px 7px 2px 9px;gap:0}
.evt.short .et{-webkit-line-clamp:1;font-size:9.5px}
.evt.short .eloc,.evt.short .etime{display:none}

/* 겹친 묶음 카드 */
.evt.cluster{
  overflow:visible;
  background:color-mix(in srgb,var(--evt) 22%,var(--surface));
  box-shadow:2px 2px 0 color-mix(in srgb,var(--evt) 38%,var(--surface)), 4px 4px 0 color-mix(in srgb,var(--evt) 20%,var(--surface));
}
.evt.cluster .et{padding-right:15px}
.cbadge{
  position:absolute;top:3px;right:3px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:var(--accent);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;line-height:1;z-index:2;
}

/* 겹친 일정 목록 시트 */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:none}
.lrow:active{background:var(--surface-2)}
.ldot{width:6px;height:36px;border-radius:4px;flex:none}
.lmain{flex:1;min-width:0}
.ltitle{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmeta{font-size:12.5px;color:var(--ink-2);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lchev{color:var(--muted);font-size:22px;font-weight:400;flex:none;line-height:1}

/* now line */
.nowline{position:absolute;z-index:6;pointer-events:none;height:0}
.nowline .l{position:absolute;left:0;right:0;height:2px;background:var(--now);border-radius:2px}
.nowline .d{position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now);box-shadow:0 0 0 2px var(--surface)}

/* empty hint */
.hint{
  position:absolute;left:50%;top:38%;transform:translateX(-50%);
  text-align:center;color:var(--muted);font-size:13px;font-weight:600;
  pointer-events:none;z-index:2;width:80%;line-height:1.5;
}
.hint svg{width:30px;height:30px;stroke:var(--muted);stroke-width:1.6;fill:none;margin-bottom:8px;opacity:.7}

/* ---------- Modal / sheet ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(15,15,25,.42);z-index:50;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
  backdrop-filter:blur(2px);
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:var(--surface);border-radius:22px 22px 0 0;
  padding:8px 18px calc(18px + var(--sab));
  max-width:520px;margin:0 auto;box-shadow:var(--shadow);
  transform:translateY(102%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-height:92dvh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line-strong);margin:6px auto 14px}
.sheet h2{font-size:18px;font-weight:800;margin:0 0 16px;letter-spacing:-.01em}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:16px}
.seg button{padding:9px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-2);transition:.15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px;letter-spacing:.01em}
.field input[type=text],.field input[type=date],.field input[type=time]{
  width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line-strong);
  background:var(--surface-2);color:var(--ink);font-size:15.5px;font-weight:600;font-family:inherit;
  -webkit-appearance:none;appearance:none;
}
.field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field input::placeholder{color:var(--muted);font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.chips{display:flex;gap:6px}
.chips button{
  flex:1;padding:10px 0;border-radius:11px;font-weight:700;font-size:14px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);transition:.12s;
}
.chips button.on{background:var(--accent);color:#fff;border-color:transparent}

.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;position:relative;transition:transform .12s}
.swatches button:active{transform:scale(.9)}
.swatches button.on{outline:2.5px solid var(--ink);outline-offset:2px}

/* 카테고리 선택 칩 (일정 폼) */
.catchips{display:flex;flex-wrap:wrap;gap:7px}
.catchip{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:12px;font-weight:700;font-size:13.5px;background:var(--surface-2);color:var(--ink-2);border:1.5px solid transparent;transition:.12s}
.catchip:active{transform:scale(.96)}
.catchip .cdot{width:11px;height:11px;border-radius:50%;flex:none}
.catchip.on{background:var(--surface);color:var(--ink);border-color:var(--accent);box-shadow:var(--shadow-sm)}
.catchip.addcat{color:var(--accent);border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--surface))}

/* 카테고리 관리 목록 */
.crow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none}
.crow .ldot{width:14px;height:14px;border-radius:5px;flex:none}
.crow .cname{flex:1;font-weight:700;font-size:15px}
.cdel{width:30px;height:30px;border-radius:9px;color:var(--muted);font-size:15px;font-weight:700;background:var(--surface-2)}
.cdel:active{background:var(--line-strong)}
.catadd{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}

.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1;padding:14px;border-radius:14px;font-weight:800;font-size:15.5px;transition:transform .1s}
.actions button:active{transform:scale(.97)}
.btn-save{background:var(--accent);color:#fff}
.btn-cancel{background:var(--surface-2);color:var(--ink)}
.btn-del{background:transparent;color:var(--now);flex:none;width:52px;font-size:20px}
.btn-del svg{width:20px;height:20px;stroke:var(--now);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.err{color:var(--now);font-size:12.5px;font-weight:600;margin-top:-6px;margin-bottom:10px;min-height:0}

/* ---------- Backup sheet ---------- */
.bk-note{font-size:13px;color:var(--ink-2);line-height:1.55;background:var(--surface-2);padding:13px 15px;border-radius:13px;margin-bottom:16px}
.bk-note b{color:var(--ink)}
.bk-btn{width:100%;padding:15px;border-radius:14px;font-weight:800;font-size:15.5px;margin-bottom:10px;background:var(--accent);color:#fff;transition:transform .1s;display:flex;align-items:center;justify-content:center;gap:8px}
.bk-btn:active{transform:scale(.98)}
.bk-btn.ghost{background:var(--surface-2);color:var(--ink)}
.bk-last{font-size:12.5px;color:var(--muted);font-weight:600;text-align:center;margin:2px 0 4px}
.bk-cap{font-size:12px;color:var(--muted);font-weight:500;text-align:center;margin-top:14px;line-height:1.55}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important}
}
</style>

<div class="planner">
  <div class="topbar">
    <div class="topbar-row">
      <div class="left-group">
        <button class="backbtn" id="backBtn" aria-label="주간으로 돌아가기" style="display:none"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>주간</button>
        <div class="title">
          <div class="month" id="monthLabel">—</div>
          <div class="range tnum" id="rangeLabel">—</div>
        </div>
      </div>
      <div class="ctrls">
        <button class="iconbtn" id="prevBtn" aria-label="이전 주"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="today-btn" id="todayBtn">오늘</button>
        <button class="iconbtn" id="nextBtn" aria-label="다음 주"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="iconbtn add-btn" id="addBtn" aria-label="일정 추가"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
  </div>

  <div class="filterbar" id="filterbar"></div>

  <div class="dayhead">
    <div class="corner">
      <button class="cornerbtn" id="menuBtn" aria-label="백업 · 복원"><svg viewBox="0 0 24 24"><path d="M12 3v10"/><path d="M8 9l4 4 4-4"/><path d="M5 16v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3"/></svg><span>백업</span></button>
    </div>
    <div class="hdays" id="hdays"></div>
  </div>

  <div class="scroll" id="scroll">
    <div class="board">
      <div class="gutter" id="gutter"></div>
      <div class="days" id="days"></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<!-- Add / edit sheet -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h2 id="sheetTitle">일정 추가</h2>

  <div class="seg" id="typeSeg">
    <button data-type="lecture" class="on">🔁 매주 반복</button>
    <button data-type="appointment">📅 특정 날짜</button>
  </div>

  <div class="field">
    <label>제목</label>
    <input type="text" id="fTitle" placeholder="예: 알고리즘 강의 / 헬스 / 스터디" autocomplete="off">
  </div>
  <div class="field">
    <label>장소 <span style="font-weight:500;color:var(--muted)">(선택)</span></label>
    <input type="text" id="fLoc" placeholder="예: 공학관 302호" autocomplete="off">
  </div>

  <div class="field" id="daysField">
    <label>요일 <span style="font-weight:500;color:var(--muted)">(여러 개 선택 가능)</span></label>
    <div class="chips" id="dayChips"></div>
  </div>

    <label>반복 기간 <span style="font-weight:500;color:var(--muted)">(선택 · 비우면 계속 반복)</span></label>
    <div class="two">
      <input type="date" id="fFrom" aria-label="반복 시작일">
      <input type="date" id="fUntil" aria-label="반복 종료일">

    <div class="field"><label>종료</label><input type="time" id="fEnd" step="300"></div>

    <label>카테고리</label>

  <div class="err" id="err"></div>

  <div class="actions">
    <button class="btn-del" id="delBtn" style="display:none" aria-label="삭제"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
    <button class="btn-cancel" id="cancelBtn">취소</button>

<div class="sheet" id="catSheet" role="dialog" aria-modal="true">

  <div class="catadd">
    <div class="field" style="margin-bottom:10px">
      <label>새 카테고리</label>
      <input type="text" id="newCatName" placeholder="이름 (예: 알바, 동아리)" maxlength="10" autocomplete="off">

<script>
(function(){
  "use strict";
  var KEY = "weekly-planner-events-v1";
  var AUTOKEY = "weekly-planner-events-v1-autobak";
  var METAKEY = "weekly-planner-meta";
  var COLORS = ["#9EA0EA","#6FCBB4","#F5A3B5","#F4C58A","#C7ACEE","#8CC4EA","#98D8A0","#A9B2C3"]; // pastel
  var CAT_KEY = "weekly-planner-categories";
  var HIDDEN_KEY = "weekly-planner-hidden-cats";
  var DEFAULT_CATS = [
    { id:"lec", name:"강의", color:"#9EA0EA" },
    { id:"mtg", name:"회의", color:"#F4C58A" },
    { id:"apt", name:"약속", color:"#F5A3B5" },
    { id:"psn", name:"개인", color:"#6FCBB4" },
    { id:"etc", name:"기타", color:"#A9B2C3" }
  ];
  var DOW = ["월","화","수","목","금","토","일"]; // Mon..Sun, index 0..6
  var DAY_START = 0, DAY_END = 24; // hours rendered
  var hourH = 54;

  // ---- state ----
  var events = load();
  var anchor = new Date();           // any date within the shown week
  var selDate = ymd(new Date());     // selected/highlighted day (day view의 대상 날짜)
  var view = "week";                 // "week" | "day"
  var editId = null;
  var categories = loadCategories();
  var hidden = loadHidden();         // { catId: true } — 숨긴 카테고리
  (function migrateCats(){ var ch=false; for(var i=0;i<events.length;i++){ if(!events[i].cat){ events[i].cat=(events[i].type==="lecture")?"lec":"apt"; ch=true; } } if(ch) save(); })();
  var newCatColor = COLORS[0], catReturnToForm = false;
  var showCat = (function(){ try{ return localStorage.getItem("weekly-planner-showcat")==="1"; }catch(e){ return false; } })(); // 제목 대신 분류 이름 표시
  var form = { type:"lecture", days:[], date:selDate, cat:(categories[0]&&categories[0].id) };

  // ---- 한국 공휴일 (Nager.Date API, 키 불필요·CORS 지원) ----
  var holidays = {};           // { "YYYY-MM-DD": "공휴일 이름" }
  var loadedYears = {}, pendingYears = {};
  var HOLIDAY_EXCLUDE = { "Constitution Day":1, "Labour Day":1 }; // 제헌절·노동절은 공휴일 아님

  // ---- helpers ----
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
  function cleanEvents(){
    return events.map(function(e){ var o={}; for(var k in e){ if(e.hasOwnProperty(k) && k.charAt(0)!=="_") o[k]=e[k]; } return o; });
  }
  function save(){
    try{
      var clean = cleanEvents();
      var json = JSON.stringify(clean);
      localStorage.setItem(KEY, json);
      // 자동 백업: 변경마다 별도 키에 사본 보관
      localStorage.setItem(AUTOKEY, JSON.stringify({ ts: Date.now(), v:1, data: clean }));
    }catch(e){}
  }
  function getMeta(){ try{ return JSON.parse(localStorage.getItem(METAKEY)) || {}; }catch(e){ return {}; } }
  function setMeta(m){ try{ localStorage.setItem(METAKEY, JSON.stringify(m)); }catch(e){} }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function pad(n){ return (n<10?"0":"")+n; }
  function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseYmd(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
  function wd(d){ return (d.getDay()+6)%7; } // weekday Mon=0..Sun=6
  function mondayOf(d){ var x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-wd(x)); return x; }
  function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function minToStr(m){ return pad(Math.floor(m/60))+":"+pad(m%60); }
  function strToMin(s){ var p=s.split(":"); return (+p[0])*60+(+p[1]); }

  // ---- 카테고리 ----
  function loadCategories(){ try{ var c=JSON.parse(localStorage.getItem(CAT_KEY)); if(Array.isArray(c)&&c.length) return c; }catch(e){} return DEFAULT_CATS.map(function(x){ return {id:x.id,name:x.name,color:x.color}; }); }
  function saveCategories(){ try{ localStorage.setItem(CAT_KEY, JSON.stringify(categories)); }catch(e){} }
  function loadHidden(){ try{ var h=JSON.parse(localStorage.getItem(HIDDEN_KEY)); if(h && typeof h==="object") return h; }catch(e){} return {}; }
  function saveHidden(){ try{ localStorage.setItem(HIDDEN_KEY, JSON.stringify(hidden)); }catch(e){} }
  function catById(id){ for(var i=0;i<categories.length;i++){ if(categories[i].id===id) return categories[i]; } return null; }
  function catColor(id){ var c=catById(id); return c?c.color:COLORS[0]; }
  function catName(id){ var c=catById(id); return c?c.name:"기타"; }
  function evColor(e){ var c=catById(e.cat); return c?c.color:(e.color||COLORS[0]); }
  function evLabel(e){ return showCat ? catName(e.cat) : (e.title||"제목 없음"); } // 표시 텍스트: 분류 이름 or 제목
  function saveShowCat(){ try{ localStorage.setItem("weekly-planner-showcat", showCat?"1":"0"); }catch(e){} }

  function weekDates(){ var mon=mondayOf(anchor); var arr=[]; for(var i=0;i<7;i++)arr.push(addDays(mon,i)); return arr; }
  function eventsForDate(d){
    var wday=wd(d), ds=ymd(d), out=[];
    for(var i=0;i<events.length;i++){ var e=events[i];
      if(e.cat && hidden[e.cat]) continue;                 // 숨긴 카테고리
      if(e.type==="lecture"){
        if(!e.days || e.days.indexOf(wday)<0) continue;   // 요일 안 맞으면 skip
        if(e.from && ds < e.from) continue;               // 반복 시작 전
        if(e.until && ds > e.until) continue;              // 반복 종료 후
        out.push(e);
      } else {
        if(e.date===ds) out.push(e);
      }
    }
    return out;
  }

  // ---- 공휴일 로드 (캐시 우선 + 네트워크 갱신) ----
  function holKey(y){ return "weekly-planner-holidays-"+y; }
  function applyHolidays(y,map){ for(var k in map) holidays[k]=map[k]; loadedYears[y]=1; }
  function loadHolidayCache(y){
    if(loadedYears[y]) return;
    try{ var c=JSON.parse(localStorage.getItem(holKey(y))||"null"); if(c&&c.map) applyHolidays(y,c.map); }catch(e){}
  }
  function refreshHolidays(y){
    if(pendingYears[y]) return;
    var c=null; try{ c=JSON.parse(localStorage.getItem(holKey(y))||"null"); }catch(e){}
    if(c&&c.map&&c.fetchedAt&&(Date.now()-c.fetchedAt)<60*86400000) return; // 캐시 신선하면 네트워크 skip
    pendingYears[y]=1;
    fetch("https://date.nager.at/api/v3/PublicHolidays/"+y+"/KR")
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(arr){
        if(!arr) throw 0;
        var map={};
        arr.forEach(function(h){ if(HOLIDAY_EXCLUDE[h.name])return; map[h.date]=h.localName||h.name; });
        try{ localStorage.setItem(holKey(y), JSON.stringify({fetchedAt:Date.now(), map:map})); }catch(e){}
        delete pendingYears[y]; applyHolidays(y,map); render();
      })
      .catch(function(){ delete pendingYears[y]; });
  }

  // ---- render header + gutter (once) ----
  var gutterEl=document.getElementById("gutter");
  (function buildGutter(){
    var h="";
    for(var i=DAY_START;i<DAY_END;i++){
      var lab = i===0?"": (i<12? i+"시" : i===12? "정오" : (i-12)+"시");
      h+='<div class="hr"><span>'+lab+'</span></div>';
    }
    gutterEl.innerHTML=h;
    document.documentElement.style.setProperty("--hourH", hourH+"px");
  })();

  var hdaysEl=document.getElementById("hdays");
  var daysEl=document.getElementById("days");
  var backBtn=document.getElementById("backBtn");
  daysEl.style.height = ((DAY_END-DAY_START)*hourH)+"px";

  function render(){
    var isDay = (view==="day");
    var dates = isDay ? [parseYmd(selDate)] : weekDates();
    var nCols = dates.length;
    var today=ymd(new Date());

    // 열 개수: 주간 7 / 하루 1
    hdaysEl.style.gridTemplateColumns="repeat("+nCols+",1fr)";
    daysEl.style.gridTemplateColumns="repeat("+nCols+",1fr)";

    // 보이는 연도의 공휴일 캐시 로드
    var years={}; for(var yi=0;yi<dates.length;yi++) years[dates[yi].getFullYear()]=1;
    for(var yk in years) loadHolidayCache(+yk);

    // 상단 라벨
    var mL=document.getElementById("monthLabel");
    if(isDay){
      var dd0=dates[0];
      mL.textContent=(dd0.getMonth()+1)+"월 "+dd0.getDate()+"일";
      document.getElementById("rangeLabel").textContent=DOW[wd(dd0)]+"요일";
    } else {
      var first=dates[0], last=dates[6];
      if(first.getMonth()===last.getMonth()) mL.textContent=first.getFullYear()+"년 "+(first.getMonth()+1)+"월";
      else mL.textContent=(first.getMonth()+1)+"월 – "+(last.getMonth()+1)+"월";
      document.getElementById("rangeLabel").textContent=(first.getMonth()+1)+"/"+first.getDate()+" – "+(last.getMonth()+1)+"/"+last.getDate();
    }
    backBtn.style.display=isDay?"":"none";

    // day header
    var hh="";
    for(var i=0;i<dates.length;i++){ var d=dates[i], ds=ymd(d), wi=isDay?wd(d):i;
      var hol=holidays[ds];
      var cls="dh"+(wi===5?" sat":"")+(wi===6?" sun":"")+(ds===today?" today":"")+((!isDay&&ds===selDate)?" sel":"")+(hol?" holiday":"");
      hh+='<div class="'+cls+'" data-date="'+ds+'"><div class="dow">'+DOW[wi]+'</div><div class="dnum tnum">'+d.getDate()+'</div>'+(hol?'<div class="hname" title="'+esc(hol)+'">'+esc(hol)+'</div>':'')+'</div>';
    }
    hdaysEl.innerHTML=hh;

    // day columns
    var dh="";
    for(var j=0;j<dates.length;j++){ var ddc=dates[j], dds=ymd(ddc), wj=isDay?wd(ddc):j;
      var wknd=(wj>=5)?" wknd":"", istoday=(dds===today)?" today":"", ishol=holidays[dds]?" holiday":"";
      dh+='<div class="daycol'+wknd+ishol+istoday+'" data-date="'+dds+'" data-idx="'+j+'"></div>';
    }
    daysEl.innerHTML=dh;

    var cols=daysEl.querySelectorAll(".daycol");
    var any=false;
    for(var k=0;k<dates.length;k++){
      var col=cols[k], d2=dates[k];
      var evs=eventsForDate(d2);
      evs.sort(function(a,b){ return a.start-b.start || a.end-b.end; });
      var clusters=clusterize(evs);
      for(var m=0;m<clusters.length;m++){ any=true;
        col.appendChild(clusters[m].length===1 ? evNode(clusters[m][0]) : clusterNode(clusters[m]));
      }
    }

    // now line
    var nl=daysEl.querySelector(".nowline"); if(nl)nl.remove();
    var now=new Date(), nowYmd=ymd(now);
    var tIdx=-1; for(var t=0;t<dates.length;t++){ if(ymd(dates[t])===nowYmd){tIdx=t;break;} }
    if(tIdx>=0){
      var nowMin=now.getHours()*60+now.getMinutes();
      var y=(nowMin-DAY_START*60)/60*hourH;
      var wrap=document.createElement("div"); wrap.className="nowline";
      wrap.style.top=y+"px"; wrap.style.left=(tIdx/nCols*100)+"%"; wrap.style.width=(100/nCols)+"%";
      wrap.innerHTML='<div class="d"></div><div class="l"></div>';
      daysEl.appendChild(wrap);
    }

    // hint
    var hint=daysEl.querySelector(".hint"); if(hint)hint.remove();
    if(!any && events.length===0){
      var hn=document.createElement("div"); hn.className="hint";
      hn.innerHTML='<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M12 13v4M10 15h4"/></svg><div>빈 칸을 탭해서<br>반복 일정·약속을 추가해 보세요</div>';
      daysEl.appendChild(hn);
    }

    // 공휴일 네트워크 갱신 (캐시 없거나 오래되면 받아와서 다시 그림)
    for(var yr in years) refreshHolidays(+yr);
  }

  // 겹치는 일정을 하나의 묶음(cluster)으로 그룹화 (evs는 start 기준 정렬돼 있어야 함)
  function clusterize(evs){
    var clusters=[], cur=[], curMaxEnd=-1;
    for(var i=0;i<evs.length;i++){ var e=evs[i];
      if(cur.length && e.start>=curMaxEnd){ clusters.push(cur); cur=[]; curMaxEnd=-1; }
      cur.push(e); if(e.end>curMaxEnd)curMaxEnd=e.end;
    }
    if(cur.length) clusters.push(cur);
    return clusters;
  }

  // 겹친 묶음 카드 (개수 배지 + 첫 일정 제목, 탭하면 목록)
  function clusterNode(cl){
    var minStart=cl[0].start, maxEnd=cl[0].end;
    for(var i=1;i<cl.length;i++){ if(cl[i].start<minStart)minStart=cl[i].start; if(cl[i].end>maxEnd)maxEnd=cl[i].end; }
    var el=document.createElement("div");
    var dur=maxEnd-minStart;
    el.className="evt cluster"+(dur<=35?" short":"");
    el.style.setProperty("--evt", evColor(cl[0]));
    el.style.top=((minStart-DAY_START*60)/60*hourH)+"px";
    el.style.height=Math.max(dur/60*hourH-2,15)+"px";
    el.style.left="calc(0% + 2px)"; el.style.width="calc(100% - 8px)";
    var inner='<span class="cbadge">'+cl.length+'</span>';
    inner+='<div class="et">'+esc(evLabel(cl[0]))+' 외 '+(cl.length-1)+'</div>';
    inner+='<div class="etime tnum">'+minToStr(minStart)+'~'+minToStr(maxEnd)+'</div>';
    el.innerHTML=inner;
    el.addEventListener("click", function(ev){ ev.stopPropagation(); openClusterList(cl); });
    return el;
  }

  function evNode(e){
    var el=document.createElement("div");
    var dur=e.end-e.start;
    el.className="evt "+(e.type==="lecture"?"lecture":"appointment")+(dur<=35?" short":"");
    el.style.setProperty("--evt", evColor(e));
    var top=(e.start-DAY_START*60)/60*hourH;
    var height=Math.max(dur/60*hourH-2, 15);
    el.style.top=top+"px"; el.style.height=height+"px";
    var n=e._cols||1, c=e._col||0;
    el.style.left="calc("+(c/n*100)+"% + 2px)";
    el.style.width="calc("+(100/n)+"% - 4px)";
    el.style.zIndex=4+c;
    var inner='<div class="et">'+esc(evLabel(e))+'</div>';
    if(e.location) inner+='<div class="eloc">'+esc(e.location)+'</div>';
    inner+='<div class="etime tnum">'+minToStr(e.start)+'</div>';
    el.innerHTML=inner;
    el.addEventListener("click", function(ev){ ev.stopPropagation(); openEdit(e); });
    return el;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  // ---- tap empty slot to add ----
  daysEl.addEventListener("click", function(ev){
    var col=ev.target.closest(".daycol"); if(!col)return;
    if(ev.target.closest(".evt"))return;
    var rect=col.getBoundingClientRect();
    var y=ev.clientY-rect.top;
    var min=Math.round((y/hourH*60 + DAY_START*60)/30)*30;
    if(min<0)min=0; if(min>23*60)min=23*60;
    openAdd(col.getAttribute("data-date"), min);
  });

  // 요일(날짜) 탭 -> 하루 크게 보기
  hdaysEl.addEventListener("click", function(ev){
    var dh=ev.target.closest(".dh"); if(!dh)return;
    if(view==="week"){ selDate=dh.getAttribute("data-date"); anchor=parseYmd(selDate); view="day"; render(); }
  });

  // ---- nav ----
  document.getElementById("prevBtn").onclick=function(){
    if(view==="day"){ selDate=ymd(addDays(parseYmd(selDate),-1)); anchor=parseYmd(selDate); }
    else anchor=addDays(mondayOf(anchor),-7);
    render();
  };
  document.getElementById("nextBtn").onclick=function(){
    if(view==="day"){ selDate=ymd(addDays(parseYmd(selDate),1)); anchor=parseYmd(selDate); }
    else anchor=addDays(mondayOf(anchor),7);
    render();
  };
  document.getElementById("todayBtn").onclick=function(){ anchor=new Date(); selDate=ymd(new Date()); render(); scrollToNow(); };
  document.getElementById("addBtn").onclick=function(){ openAdd(selDate, 9*60); };
  backBtn.onclick=function(){ view="week"; render(); };

  // ================= Sheets =================
  var scrim=document.getElementById("scrim");
  var sheet=document.getElementById("sheet");
  var backupSheet=document.getElementById("backupSheet");
  var listSheet=document.getElementById("listSheet");
  var catSheet=document.getElementById("catSheet");
  var fTitle=document.getElementById("fTitle"), fLoc=document.getElementById("fLoc"),
      fDate=document.getElementById("fDate"), fStart=document.getElementById("fStart"),
      fEnd=document.getElementById("fEnd"), errEl=document.getElementById("err");
  var daysField=document.getElementById("daysField"), dateField=document.getElementById("dateField"),
      rangeField=document.getElementById("rangeField");
  var fFrom=document.getElementById("fFrom"), fUntil=document.getElementById("fUntil");

  (function(){ var h=""; for(var i=0;i<7;i++)h+='<button data-d="'+i+'">'+DOW[i]+'</button>'; document.getElementById("dayChips").innerHTML=h; })();

  document.getElementById("typeSeg").addEventListener("click",function(ev){
    var b=ev.target.closest("button"); if(!b)return;
    form.type=b.getAttribute("data-type"); syncType();
  });
  document.getElementById("dayChips").addEventListener("click",function(ev){
    var b=ev.target.closest("button"); if(!b)return;
    var d=+b.getAttribute("data-d"); var i=form.days.indexOf(d);
    if(i>=0)form.days.splice(i,1); else form.days.push(d);
    syncChips();
  });

  // 폼 안의 카테고리 선택 칩
  function buildCatChips(){
    var h="";
    categories.forEach(function(c){
      h+='<button class="catchip" data-cat="'+c.id+'"><span class="cdot" style="background:'+c.color+'"></span>'+esc(c.name)+'</button>';
    });
    h+='<button class="catchip addcat" id="catAddChip">+ 새 카테고리</button>';
    document.getElementById("catChips").innerHTML=h;
    syncCat();
  }
  function syncCat(){
    document.querySelectorAll("#catChips .catchip[data-cat]").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-cat")===form.cat);
    });
  }
  document.getElementById("catChips").addEventListener("click",function(ev){
    if(ev.target.closest("#catAddChip")){ openCatManage(true); return; }
    var b=ev.target.closest(".catchip[data-cat]"); if(!b)return;
    form.cat=b.getAttribute("data-cat"); syncCat();
  });

  function syncType(){
    document.querySelectorAll("#typeSeg button").forEach(function(s){ s.classList.toggle("on", s.getAttribute("data-type")===form.type); });
    var isRepeat = form.type==="lecture";
    daysField.style.display = isRepeat?"":"none";
    rangeField.style.display = isRepeat?"":"none";
    dateField.style.display = isRepeat?"none":"";
  }
  function syncChips(){
    document.querySelectorAll("#dayChips button").forEach(function(b){
      b.classList.toggle("on", form.days.indexOf(+b.getAttribute("data-d"))>=0);
    });
  }

  // ---- 카테고리 필터 바 (메인 화면) ----
  var filterbarEl=document.getElementById("filterbar");
  function buildFilterbar(){
    var h='<button class="fchip modetoggle'+(showCat?" on":"")+'" id="modeToggle" aria-label="제목/분류 표시 전환"><svg viewBox="0 0 24 24"><path d="M20.6 13.4L11 3.8A2 2 0 0 0 9.6 3.2H4a1 1 0 0 0-1 1v5.6a2 2 0 0 0 .6 1.4l9.6 9.6a2 2 0 0 0 2.8 0l4.6-4.6a2 2 0 0 0 0-2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>분류</button><span class="fdiv"></span>';
    categories.forEach(function(c){
      h+='<button class="fchip'+(hidden[c.id]?" off":"")+'" data-cat="'+c.id+'"><span class="cdot" style="background:'+c.color+'"></span>'+esc(c.name)+'</button>';
    });
    h+='<button class="fchip manage" id="catManageBtn" aria-label="카테고리 관리"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H23a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>';
    filterbarEl.innerHTML=h;
  }
  filterbarEl.addEventListener("click",function(ev){
    if(ev.target.closest("#modeToggle")){ showCat=!showCat; saveShowCat(); buildFilterbar(); render(); return; }
    if(ev.target.closest("#catManageBtn")){ openCatManage(false); return; }
    var b=ev.target.closest(".fchip[data-cat]"); if(!b)return;
    var id=b.getAttribute("data-cat");
    if(hidden[id]) delete hidden[id]; else hidden[id]=true;
    saveHidden(); buildFilterbar(); render();
  });

  // ---- 카테고리 관리 시트 ----
  function buildCatList(){
    var h="";
    categories.forEach(function(c){
      h+='<div class="crow"><span class="ldot" style="background:'+c.color+'"></span><div class="cname">'+esc(c.name)+'</div><button class="cdel" data-del="'+c.id+'" aria-label="삭제">✕</button></div>';
    });
    document.getElementById("catList").innerHTML=h;
  }
  function buildNewCatColors(){
    var h=""; COLORS.forEach(function(c){ h+='<button data-c="'+c+'" style="background:'+c+'"></button>'; });
    document.getElementById("newCatColors").innerHTML=h;
    newCatColor=COLORS[0]; syncNewCatColor();
  }
  function syncNewCatColor(){ document.querySelectorAll("#newCatColors button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-c")===newCatColor); }); }
  document.getElementById("newCatColors").addEventListener("click",function(ev){ var b=ev.target.closest("button"); if(!b)return; newCatColor=b.getAttribute("data-c"); syncNewCatColor(); });

  function openCatManage(fromForm){
    catReturnToForm=!!fromForm;
    if(fromForm) sheet.classList.remove("on");
    buildCatList(); buildNewCatColors(); document.getElementById("newCatName").value="";
    openSheet(catSheet);
  }
  function closeCatManage(){
    catSheet.classList.remove("on");
    if(catReturnToForm){ catReturnToForm=false; buildCatChips(); if(!catById(form.cat)) form.cat=categories[0].id; syncCat(); sheet.classList.add("on"); }
    else closeSheet();
  }
  document.getElementById("catCloseBtn").onclick=closeCatManage;
  document.getElementById("catAddBtn").onclick=function(){
    var name=document.getElementById("newCatName").value.trim();
    if(!name) return;
    categories.push({ id:"c"+uid(), name:name, color:newCatColor });
    saveCategories();
    document.getElementById("newCatName").value="";
    buildCatList(); buildNewCatColors(); buildFilterbar();
  };
  document.getElementById("catList").addEventListener("click",function(ev){
    var d=ev.target.closest(".cdel"); if(!d)return;
    if(categories.length<=1) return;
    var id=d.getAttribute("data-del");
    if(!confirm("이 카테고리를 삭제할까요?\n(해당 일정은 저장된 색으로 계속 표시돼요)")) return;
    categories=categories.filter(function(c){ return c.id!==id; });
    if(hidden[id]){ delete hidden[id]; saveHidden(); }
    saveCategories(); buildCatList(); buildFilterbar(); render();
  });

  function openSheet(el){ scrim.classList.add("on"); el.classList.add("on"); }
  function closeSheet(){ scrim.classList.remove("on"); sheet.classList.remove("on"); backupSheet.classList.remove("on"); listSheet.classList.remove("on"); catSheet.classList.remove("on"); catReturnToForm=false; errEl.textContent=""; }
  scrim.onclick=closeSheet;
  document.getElementById("cancelBtn").onclick=closeSheet;
  document.getElementById("bkCloseBtn").onclick=closeSheet;
  document.getElementById("listCloseBtn").onclick=closeSheet;

  // 겹친 일정 목록 열기 (행 탭 → 해당 일정 편집)
  function openClusterList(cl){
    var body=document.getElementById("listBody"); body.innerHTML="";
    cl.slice().sort(function(a,b){ return a.start-b.start || a.end-b.end; }).forEach(function(e){
      var row=document.createElement("div"); row.className="lrow";
      row.innerHTML='<span class="ldot" style="background:'+evColor(e)+'"></span>'+
        '<div class="lmain"><div class="ltitle">'+esc(e.title||"제목 없음")+'</div>'+
        '<div class="lmeta tnum">'+minToStr(e.start)+' ~ '+minToStr(e.end)+(e.location?' · '+esc(e.location):'')+'</div></div>'+
        '<span class="lchev">›</span>';
      row.addEventListener("click", function(){ listSheet.classList.remove("on"); openEdit(e); });
      body.appendChild(row);
    });
    openSheet(listSheet);
  }

  function openAdd(dateStr, startMin){
    editId=null;
    document.getElementById("sheetTitle").textContent="일정 추가";
    document.getElementById("delBtn").style.display="none";
    var d=parseYmd(dateStr);
    form.type="lecture"; form.days=[wd(d)]; form.date=dateStr;
    if(!catById(form.cat)) form.cat=categories[0].id;   // 마지막에 쓰던 카테고리 유지
    fTitle.value=""; fLoc.value=""; fDate.value=dateStr;
    fFrom.value=""; fUntil.value="";
    fStart.value=minToStr(startMin); fEnd.value=minToStr(Math.min(startMin+60,24*60-1));
    syncType(); syncChips(); buildCatChips();
    openSheet(sheet); setTimeout(function(){ fTitle.focus(); },300);
  }
  function openEdit(e){
    editId=e.id;
    document.getElementById("sheetTitle").textContent="일정 편집";
    document.getElementById("delBtn").style.display="";
    form.type=e.type;
    form.cat=(e.cat && catById(e.cat)) ? e.cat : categories[0].id;
    form.days=(e.days||[]).slice();
    form.date=e.date||selDate;
    fTitle.value=e.title||""; fLoc.value=e.location||"";
    fDate.value=form.date;
    fFrom.value=e.from||""; fUntil.value=e.until||"";
    fStart.value=minToStr(e.start); fEnd.value=minToStr(e.end);
    syncType(); syncChips(); buildCatChips();
    openSheet(sheet);
  }

  document.getElementById("delBtn").onclick=function(){
    if(editId==null)return;
    events=events.filter(function(e){ return e.id!==editId; });
    save(); closeSheet(); render();
  };

  document.getElementById("saveBtn").onclick=function(){
    var title=fTitle.value.trim();
    if(!title){ errEl.textContent="제목을 입력해 주세요."; return; }
    var s=strToMin(fStart.value||"0:0"), en=strToMin(fEnd.value||"0:0");
    if(en<=s){ errEl.textContent="종료 시간이 시작보다 늦어야 해요."; return; }
    if(form.type==="lecture" && form.days.length===0){ errEl.textContent="요일을 하나 이상 선택해 주세요."; return; }
    if(form.type==="lecture" && fFrom.value && fUntil.value && fUntil.value < fFrom.value){ errEl.textContent="반복 종료일이 시작일보다 빨라요."; return; }

    var cat = catById(form.cat) ? form.cat : categories[0].id;
    var rec={ id: editId||uid(), type:form.type, title:title, location:fLoc.value.trim(),
              start:s, end:en, cat:cat, color:catColor(cat) };
    if(form.type==="lecture"){
      rec.days=form.days.slice();
      if(fFrom.value) rec.from=fFrom.value;
      if(fUntil.value) rec.until=fUntil.value;
    } else {
      rec.date=fDate.value||form.date;
    }

    if(editId){ for(var i=0;i<events.length;i++){ if(events[i].id===editId){ events[i]=rec; break; } } }
    else events.push(rec);
    save(); closeSheet(); render();
  };

  // ================= Backup / restore =================
  var bkLast=document.getElementById("bkLast");
  function relTime(ts){
    if(!ts) return "아직 내보낸 적 없음";
    var diff=Date.now()-ts, day=86400000;
    if(diff<60000) return "마지막 내보내기: 방금 전";
    if(diff<3600000) return "마지막 내보내기: "+Math.floor(diff/60000)+"분 전";
    if(diff<day) return "마지막 내보내기: "+Math.floor(diff/3600000)+"시간 전";
    return "마지막 내보내기: "+Math.floor(diff/day)+"일 전";
  }
  function openBackup(){ bkLast.textContent=relTime(getMeta().lastExport); openSheet(backupSheet); }
  document.getElementById("menuBtn").onclick=openBackup;

  function markExported(){
    var m=getMeta(); m.lastExport=Date.now(); setMeta(m);
    bkLast.textContent=relTime(m.lastExport);
  }
  document.getElementById("exportBtn").onclick=function(){
    var payload={ app:"weekly-planner", v:1, exportedAt:new Date().toISOString(), events:cleanEvents() };
    var json=JSON.stringify(payload,null,2);
    var fname="플래너-백업-"+ymd(new Date())+".json";
    var blob=new Blob([json],{type:"application/json"});
    try{
      var file=new File([blob],fname,{type:"application/json"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:"주간 플래너 백업"}).then(markExported).catch(function(){});
        return;
      }
    }catch(e){}
    // 폴백: 다운로드
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },1500);
    markExported();
  };

  var importFile=document.getElementById("importFile");
  document.getElementById("importBtn").onclick=function(){ importFile.value=""; importFile.click(); };
  importFile.onchange=function(){
    var f=importFile.files && importFile.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      var arr;
      try{
        var d=JSON.parse(r.result);
        arr = Array.isArray(d) ? d : (d && d.events);
        if(!Array.isArray(arr)) throw 0;
      }catch(e){ bkLast.textContent="⚠️ 파일을 읽을 수 없어요 (형식 확인)"; return; }
      var valid=arr.filter(function(e){ return e && typeof e==="object" && (e.type==="lecture"||e.type==="appointment") && typeof e.start==="number" && typeof e.end==="number"; });
      if(!confirm("현재 일정을 이 백업으로 덮어쓸까요?\n(불러올 일정: "+valid.length+"개)")) return;
      valid.forEach(function(e){ if(!e.id) e.id=uid(); });
      events=valid; save(); render(); closeSheet();
    };
    r.readAsText(f);
  };

  // ---- scroll helpers ----
  var scrollEl=document.getElementById("scroll");
  function scrollToNow(){
    var now=new Date(); var m=now.getHours()*60+now.getMinutes();
    var y=(m-DAY_START*60)/60*hourH - 120;
    scrollEl.scrollTop=Math.max(0,y);
  }

  // ---- init ----
  buildFilterbar();
  render();
  (function(){ var m=Math.max(8*60, new Date().getHours()*60); var y=(m-DAY_START*60)/60*hourH-120; scrollEl.scrollTop=Math.max(0,y); })();
  setInterval(render, 60000);
})();
</script>

<script>
// PWA: register service worker for offline use
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
