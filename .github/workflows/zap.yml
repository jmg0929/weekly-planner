# DAST — 배포된 실제 사이트를 OWASP ZAP baseline(수동 · 비공격 스캔)으로 매주 점검
# 결과는 GitHub 이슈 하나("ZAP 주간 점검")에 계속 갱신 + 보고서 파일(artifact)
# 대상은 이 저장소의 GitHub Pages 사이트뿐 (본인 소유). 로그인 · 동기화 서버는 스캔하지 않음
name: ZAP

on:
  schedule:
    - cron: "5 4 * * 1" # 매주 월요일 13:05 (KST)
  push:
    branches: [main]
    paths: [".zap/**", ".github/workflows/zap.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap
  cancel-in-progress: false

jobs:
  baseline:
    name: ZAP baseline (실제 사이트)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # 결과 이슈 만들기 · 갱신
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "https://jmg0929.github.io/weekly-planner/"
          # 이미지도 다이제스트로 고정 (zap-stable 2026-10-26 빌드)
          docker_name: "zaproxy/zap-stable@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
          issue_title: "ZAP 주간 점검"
          fail_action: false
          artifact_name: "zap_report"
