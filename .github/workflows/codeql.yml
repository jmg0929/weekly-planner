# CodeQL — GitHub의 코드 분석 엔진으로 JavaScript 보안 취약점 검사 (index.html 안 스크립트 포함)
# 사용자 규칙(Semgrep)이 "이 프로젝트의 약속"을 검사한다면, CodeQL은 일반적인 취약점 패턴 전반을 검사
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1" # 매주 월요일 12:23 (KST) — 코드가 그대로여도 새 규칙으로 다시 검사
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (javascript)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:javascript-typescript"
